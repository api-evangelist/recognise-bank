aid: recognise-bank
url: https://raw.githubusercontent.com/api-evangelist/recognise-bank/refs/heads/main/apis.yml
name: Recognise Bank
kind: company
description: >-
  Recognise Bank Limited is a UK challenger bank focused on the SME sector and
  the personal and business savings markets, offering fixed-rate, notice, and
  easy-access savings accounts alongside secured SME lending such as bridging
  loans and commercial mortgages. Formed out of AIM-listed City of London Group
  and now majority owned by Gibraltar-based Parasol V27 Limited (the Ruth Parasol
  family office), it is authorised by the Prudential Regulation Authority and
  regulated by the Financial Conduct Authority under FRN 849404, with deposits
  protected by the FSCS. As a deposit-and-lending institution that does not offer
  payment/current accounts, Recognise Bank is not one of the CMA9 and publishes
  no dedicated developer portal, Open Banking Open Data endpoint, or Read/Write
  API surface at review time; the UK Open Banking (OBIE / PSD2) API families are
  represented here as the shared industry standard the bank would conform to if
  it exposed regulated account and payment interfaces, not as confirmed
  Recognise-operated endpoints.
