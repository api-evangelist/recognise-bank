apis:
- aid: recognise-bank:uk-open-banking-open-data-api
  name: UK Open Banking Open Data API (OBIE Standard)
  description: >-
    Shared UK Open Banking Open Data standard for public, unauthenticated
    reference data (ATMs, branches, personal and business current accounts,
    unsecured SME loans, commercial credit cards). Included as the OBIE standard
    surface; Recognise Bank does not publish a confirmed Open Data endpoint and
    probes to the standard path shape on recognisebank.co.uk returned HTTP 404.
  humanURL: https://github.com/OpenBankingUK/opendata-api-spec-compiled
  baseURL: /open-banking/v2.3
  tags:
  - Open Data
  - Reference Data
  properties:
